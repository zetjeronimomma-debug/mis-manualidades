<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lapiceros personalizados - Dalkomi</title>

    <style>
        body {
            background: linear-gradient(135deg, #EFAF96, #EA9087, #CB8D9A, #9D98AE, #8497B5);
            font-family: "Comic Sans MS", cursive;
            text-align: center;
            margin: 0;
            padding: 20px 15px;
            overflow-x: hidden;
        }

        h1 {
            color: white;
            font-size: 34px;
            text-shadow: 2px 2px 5px black;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: white;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* GALERÍA */
        .galeria {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        img {
            width: 95%;
            max-width: 320px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        ul {
            list-style: none;
            padding: 0;
            margin-bottom: 25px;
        }

        li {
            background-color: rgba(255,255,255,0.95);
            margin: 12px auto;
            padding: 14px;
            width: 95%;
            max-width: 320px;
            border-radius: 18px;
            box-shadow: 2px 2px 10px gray;
            font-weight: bold;
            font-size: 16px;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            padding: 14px 22px;
            background: linear-gradient(45deg, #8497B5, #9D98AE);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-size: 16px;
        }

        /* TABLET / PC */
        @media (min-width: 768px) {
            .galeria {
                flex-direction: row;
                justify-content: center;
            }

            img {
                width: 200px;
            }
        }

        /* Gomitas flotando */
        .gomita {
            position: fixed;
            bottom: -10px;
            font-size: 20px;
            animation: subir 6s linear infinite;
        }

        @keyframes subir {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-800px); opacity: 0; }
        }
    </style>
</head>

<body>

    <h1>Lapiceros personalizados</h1>

    <div class="galeria">
        <img src="lapiz.jpg">
        <img src="imagenes.jpg">
    </div>

    <p>Lapiceros únicos, personalizados a tu estilo.</p>

    <ul>
        <li>Diseños creativos</li>
        <li>Colores variados</li>
        <li>Perfectos para regalo</li>
    </ul>

    <a href="index.html">Volver</a>

    <!-- Decoración -->
    <div class="gomita" style="left:10%;">🖊️</div>
    <div class="gomita" style="left:25%; animation-delay:1s;">✨</div>
    <div class="gomita" style="left:40%; animation-delay:2s;">🖊️</div>
    <div class="gomita" style="left:60%; animation-delay:3s;">✨</div>
    <div class="gomita" style="left:80%; animation-delay:4s;">🖊️</div>

</body>
</html>

</body>
</html>
