<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- MUY IMPORTANTE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dalkomi - Regalos versión 2.0</title>

    <style>
        body {
            font-family: "Comic Sans MS", cursive;
            margin: 0;
            background: linear-gradient(135deg, #EFAF96, #EA9087, #CB8D9A, #9D98AE, #8497B5);
            overflow-x: hidden;
        }

        header {
            background: rgba(0,0,0,0.25);
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .logo-img {
            width: 85px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            font-size: 18px;
            margin-top: 5px;
        }

        /* CONTENEDOR */
        .contenedor {
            display: flex;
            flex-direction: column; /* CLAVE */
            align-items: center;
            gap: 20px;
            padding: 20px 15px;
        }

        /* TARJETAS */
        .producto {
            background: rgba(255,255,255,0.95);
            width: 100%;
            max-width: 340px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }

        .producto h2 {
            color: #EA9087;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .producto p {
            font-size: 17px;
            margin-bottom: 15px;
        }

        .btn {
            display: block;
            padding: 15px;
            background: linear-gradient(45deg, #8497B5, #9D98AE);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
        }

        /* PC / TABLET */
        @media (min-width: 768px) {
            .contenedor {
                flex-direction: row;
                justify-content: center;
            }

            .producto {
                width: 260px;
            }
        }

        /* Gomitas */
        .gomita {
            position: fixed;
            bottom: -10px;
            font-size: 20px;
            animation: subir 6s linear infinite;
        }

        @keyframes subir {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-800px); opacity: 0; }
        }
    </style>
</head>

<body>

<header>
    <img src="./logo.jpeg" alt="Logo Dalkomi" class="logo-img">
    <h1>Dalkomi</h1>
    <p><strong>Regalos versión 2.0</strong></p>
</header>

<div class="contenedor">

    <div class="producto">
        <h2>Lapiceros Personalizados</h2>
        <p>Incluyen separadores únicos y diseños creativos.</p>
        <a class="btn" href="lapiceros.html">Comprar</a>
    </div>

    <div class="producto">
        <h2>Gomitas Enchiladas</h2>
        <p>El equilibrio perfecto entre dulce y picante.</p>
        <a class="btn" href="gomitas.html">Comprar</a>
    </div>

    <div class="producto">
        <h2>Letras con Gomitas</h2>
        <p>Personaliza nombres con dulces deliciosos.</p>
        <a class="btn" href="letras.html">Comprar</a>
    </div>

</div>

<!-- Gomitas -->
<div class="gomita" style="left:10%;">🍬</div>
<div class="gomita" style="left:25%; animation-delay:1s;">🍭</div>
<div class="gomita" style="left:40%; animation-delay:2s;">🍬</div>
<div class="gomita" style="left:60%; animation-delay:3s;">🍭</div>
<div class="gomita" style="left:80%; animation-delay:4s;">🍬</div>

</body>
</html>
